name: Build OpenWrt firmware

on:
  push:
    branches: [build, main]
  pull_request:
    branches: [build, main]
  workflow_dispatch:

concurrency:
  group: openwrt-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mx4300:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            subversion libelf-dev patch perl-modules perl python3-dev intltool \
            libxml-parser-perl xsltproc mercurial quilt

      - name: Prepare pinned OpenWrt source
        run: ./prepare-source.sh "$GITHUB_WORKSPACE/openwrt"

      - name: Restore download cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ runner.os }}-${{ hashFiles('versions.env', 'feeds.conf.lock') }}
          restore-keys: |
            openwrt-dl-${{ runner.os }}-

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: openwrt/.ccache
          key: openwrt-ccache-${{ runner.os }}-${{ hashFiles('versions.env', 'feeds.conf.lock', 'build.sh', 'patches/**') }}-${{ github.run_id }}
          restore-keys: |
            openwrt-ccache-${{ runner.os }}-${{ hashFiles('versions.env', 'feeds.conf.lock', 'build.sh', 'patches/**') }}-
            openwrt-ccache-${{ runner.os }}-

      - name: Build firmware
        run: ./build.sh "$GITHUB_WORKSPACE/openwrt"

      - name: Upload firmware and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openwrt-mx4300-firmware
          retention-days: 30
          if-no-files-found: error
          path: |
            openwrt/bin/targets/qualcommax/ipq807x/*.bin
            openwrt/bin/targets/qualcommax/ipq807x/*.ubi
            openwrt/bin/targets/qualcommax/ipq807x/*.itb
            openwrt/bin/targets/qualcommax/ipq807x/*.buildinfo
            openwrt/bin/targets/qualcommax/ipq807x/*.manifest
            openwrt/bin/targets/qualcommax/ipq807x/sha256sums
            openwrt/bin/targets/qualcommax/ipq807x/feeds.lock
            openwrt/bin/targets/qualcommax/ipq807x/source-versions.txt
            openwrt/bin/targets/qualcommax/ipq807x/wrapper-provenance.txt
            openwrt/bin/targets/qualcommax/ipq807x/wrapper-source.tar
            openwrt/bin/targets/qualcommax/ipq807x/wrapper-*.patch

  ap4:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            subversion libelf-dev patch perl-modules perl python3-dev intltool \
            libxml-parser-perl xsltproc mercurial quilt

      - name: Prepare pinned AP-4 source
        run: ./prepare-ap4-source.sh "$GITHUB_WORKSPACE/ap4-openwrt"

      - name: Restore AP-4 download cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ap4-openwrt/dl
          key: ap4-dl-${{ runner.os }}-${{ hashFiles('ap4-versions.env', 'ap4-feeds.conf.lock') }}

      - name: Restore AP-4 compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ap4-openwrt/.ccache
          key: ap4-ccache-${{ runner.os }}-${{ hashFiles('ap4-versions.env', 'ap4-feeds.conf.lock', 'build-ap4.sh') }}-${{ github.run_id }}
          restore-keys: |
            ap4-ccache-${{ runner.os }}-${{ hashFiles('ap4-versions.env', 'ap4-feeds.conf.lock', 'build-ap4.sh') }}-
            ap4-ccache-${{ runner.os }}-

      - name: Build AP-4 firmware
        run: ./build-ap4.sh "$GITHUB_WORKSPACE/ap4-openwrt"

      - name: Upload AP-4 firmware and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openwrt-ap4-firmware
          retention-days: 30
          if-no-files-found: error
          path: |
            ap4-openwrt/bin/targets/ath79/generic/*tplink_archer-c7-v2*
            ap4-openwrt/bin/targets/ath79/generic/sha256sums
            ap4-openwrt/bin/targets/ath79/generic/*.buildinfo
            ap4-openwrt/bin/targets/ath79/generic/feeds.lock
            ap4-openwrt/bin/targets/ath79/generic/source-versions.txt
            ap4-openwrt/bin/targets/ath79/generic/wrapper-provenance.txt
            ap4-openwrt/bin/targets/ath79/generic/wrapper-source.tar

  orbi:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            subversion libelf-dev patch perl-modules perl python3-dev intltool \
            libxml-parser-perl xsltproc mercurial quilt

      - name: Prepare pinned Orbi source
        run: ./prepare-orbi-source.sh "$GITHUB_WORKSPACE/orbi-openwrt"

      - name: Restore Orbi download cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: orbi-openwrt/dl
          key: orbi-dl-${{ runner.os }}-${{ hashFiles('orbi-versions.env', 'orbi-feeds.conf.lock') }}

      - name: Restore Orbi compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: orbi-openwrt/.ccache
          key: orbi-ccache-${{ runner.os }}-${{ hashFiles('orbi-versions.env', 'orbi-feeds.conf.lock', 'build-orbi.sh') }}-${{ github.run_id }}
          restore-keys: |
            orbi-ccache-${{ runner.os }}-${{ hashFiles('orbi-versions.env', 'orbi-feeds.conf.lock', 'build-orbi.sh') }}-
            orbi-ccache-${{ runner.os }}-

      - name: Build Orbi firmware
        run: ./build-orbi.sh "$GITHUB_WORKSPACE/orbi-openwrt"

      - name: Upload Orbi firmware and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openwrt-orbi-firmware
          retention-days: 30
          if-no-files-found: error
          path: |
            orbi-openwrt/bin/targets/ipq40xx/generic/*netgear_rbr20*
            orbi-openwrt/bin/targets/ipq40xx/generic/*netgear_rbs20*
            orbi-openwrt/bin/targets/ipq40xx/generic/sha256sums
            orbi-openwrt/bin/targets/ipq40xx/generic/*.buildinfo
            orbi-openwrt/bin/targets/ipq40xx/generic/feeds.lock
            orbi-openwrt/bin/targets/ipq40xx/generic/source-versions.txt
            orbi-openwrt/bin/targets/ipq40xx/generic/wrapper-provenance.txt
            orbi-openwrt/bin/targets/ipq40xx/generic/wrapper-source.tar
