name: Build MX4300/MX4301 Firmware

on:
  push:
    branches:
      - build
      - main
  pull_request:
    branches:
      - build
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h
      
      - name: Install OpenWRT build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip \
            zlib1g-dev file wget subversion libz-dev libelf-dev patch \
            perl-modules perl python3-dev intltool libxml-parser-perl \
            xsltproc mercurial quilt
      
      - name: Add qosmio remote repository
        run: |
          git remote add qosmio https://github.com/qosmio/openwrt-ipq/ || true
          git fetch qosmio
      
      - name: Add subtree for 25.12-nss
        run: |
          git subtree add --prefix 25.12-nss qosmio 25.12-nss --squash
      
      - name: Cache OpenWRT downloads
        uses: actions/cache@v4
        with:
          path: 25.12-nss/dl
          key: openwrt-downloads-${{ github.sha }}
          restore-keys: |
            openwrt-downloads-
      
      - name: Build firmware
        run: |
          cd 25.12-nss
          bash ../build.sh
          make download
          make -j$(nproc)
      
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-mx4300-firmware
          path: |
            25.12-nss/bin/targets/qualcommax/ipq807x/*sysupgrade.bin
            25.12-nss/bin/targets/qualcommax/ipq807x/sha256sums
            25.12-nss/bin/targets/qualcommax/ipq807x/*.buildinfo
          if-no-files-found: error
